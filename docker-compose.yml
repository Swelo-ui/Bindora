version: '3.8'

services:
  bindora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bindora-dock
    ports:
      - "${BINDORA_PORT:-5000}:5000"
    environment:
      - BINDORA_HOST=0.0.0.0
      - BINDORA_PORT=5000
      - BINDORA_DEBUG=${BINDORA_DEBUG:-False}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      - DATABASE_URL=sqlite:////app/data/bindora.db
      - VINA_EXE=/usr/local/bin/vina
    volumes:
      - bindora-data:/app/data
      - bindora-cache:/app/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bindora-data:
    driver: local
  bindora-cache:
    driver: local
